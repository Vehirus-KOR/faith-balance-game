<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PICK:ONE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-container">

<header class="game-header">

    <div class="header-title">
        <h1>
            PICK:ONE
        </h1>

        <p class="sub-title">
            BALANCE CARD GAME
        </p>
    </div>


    <nav
        class="header-menu"
        aria-label="게임 메뉴"
    >

<!-- 도감 -->
<button
    id="collectionButton"
    class="header-menu-btn"
    type="button"
    aria-label="도감"
    title="도감"
>
    <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
    >
        <path
            d="M4 5.5C6.8 5.5 9.2 6.2 12 8
               C14.8 6.2 17.2 5.5 20 5.5
               V18.5
               C17.2 18.5 14.8 19.2 12 21
               C9.2 19.2 6.8 18.5 4 18.5
               Z"
        />
        <path d="M12 8V21" />
    </svg>
</button>


<!-- 설정 -->
<button
    id="settingsButton"
    class="header-menu-btn"
    type="button"
    aria-label="설정"
    title="설정"
>
    <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
    >
        <circle
            cx="12"
            cy="12"
            r="3"
        />

        <path
            d="M19.4 15
               A1.7 1.7 0 0 0 19.7 16.9
               L19.8 17
               A2 2 0 1 1 17 19.8
               L16.9 19.7
               A1.7 1.7 0 0 0 15 19.4
               A1.7 1.7 0 0 0 14 21
               V21.1
               A2 2 0 1 1 10 21.1
               V21
               A1.7 1.7 0 0 0 9 19.4
               A1.7 1.7 0 0 0 7.1 19.7
               L7 19.8
               A2 2 0 1 1 4.2 17
               L4.3 16.9
               A1.7 1.7 0 0 0 4.6 15
               A1.7 1.7 0 0 0 3 14
               H2.9
               A2 2 0 1 1 2.9 10
               H3
               A1.7 1.7 0 0 0 4.6 9
               A1.7 1.7 0 0 0 4.3 7.1
               L4.2 7
               A2 2 0 1 1 7 4.2
               L7.1 4.3
               A1.7 1.7 0 0 0 9 4.6
               A1.7 1.7 0 0 0 10 3
               V2.9
               A2 2 0 1 1 14 2.9
               V3
               A1.7 1.7 0 0 0 15 4.6
               A1.7 1.7 0 0 0 16.9 4.3
               L17 4.2
               A2 2 0 1 1 19.8 7
               L19.7 7.1
               A1.7 1.7 0 0 0 19.4 9
               A1.7 1.7 0 0 0 21 10
               H21.1
               A2 2 0 1 1 21.1 14
               H21
               A1.7 1.7 0 0 0 19.4 15Z"
        />
    </svg>
</button>

    </nav>

</header>


        <!-- =========================
             카테고리 선택
        ========================== -->

        <section class="filter-area">

            <button
                class="filter-btn active"
                data-category="전체"
            >
                전체
            </button>

            <button
                class="filter-btn"
                data-category="일반"
            >
                일반
            </button>

            <button
                class="filter-btn"
                data-category="신앙"
            >
                신앙
            </button>

        </section>


        <!-- =========================
             카드 영역
        ========================== -->

<section class="card-area">

    <button
        id="cardButton"
        class="game-card"
        type="button"
    >

                <!-- 카드 뒷면 -->

<div
    id="cardBack"
    class="card-back"
>

    <p id="deckLabel">
        전체 카드덱
    </p>

    <h2>
        PICK:ONE
    </h2>

    <span>
        카드를 터치하세요
    </span>

</div>


                <!-- 카드 앞면 -->

                <div
                    id="cardFront"
                    class="card-front hidden"
                >

                    <div class="card-info">

    <div class="card-category-group">
        <span id="category">
        </span>

        <span id="cardNumber">
        </span>
    </div>

    <span id="difficulty">
    </span>

</div>

                    <p class="question">
                    <span id="question"></span>
                    </p>


                    <!-- 첫 번째 선택지 -->

                    <div class="option">

                        <p id="optionA">
                        </p>

                    </div>


                    <strong class="vs">
                        VS
                    </strong>


                    <!-- 두 번째 선택지 -->

                    <div class="option">

                        <p id="optionB">
                        </p>

                    </div>

                </div>

            </button>

        </section>


        <!-- =========================
             다음 카드
        ========================== -->

        <button
            id="nextButton"
            class="next-btn hidden"
            type="button"
        >
            다음 카드
        </button>

    </main>


    <!-- =========================
         효과음
    ========================== -->

    <audio
        id="shuffleSound"
        src="assets/sounds/shuffle.mp3"
        preload="auto"
    ></audio>

    <audio
        id="flipSound"
        src="assets/sounds/flip.mp3"
        preload="auto"
    ></audio>

    <audio
        id="revealSound"
        src="assets/sounds/reveal.mp3"
        preload="auto"
    ></audio>


    <!-- =========================
         JavaScript
         순서 중요:
         cards.js → script.js
    ========================== -->

    <script src="cards.js"></script>
    <script src="script.js"></script>

</body>
</html>
