<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        PICK:ONE
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =========================
         게임 화면
    ========================== -->

    <main class="game-container">


        <!-- =========================
             헤더
        ========================== -->

        <header class="game-header">

            <div class="header-title">

                <h1>
                    PICK:ONE
                </h1>

                <p class="sub-title">
                    BALANCE CARD GAME
                </p>

            </div>


            <nav
                class="header-menu"
                aria-label="게임 메뉴"
            >


                <!-- 도감 -->

                <button
                    id="collectionButton"
                    class="header-menu-btn"
                    type="button"
                    aria-label="도감"
                    title="도감"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="
                                M4 5.5
                                C6.8 5.5 9.2 6.2 12 8
                                C14.8 6.2 17.2 5.5 20 5.5
                                V18.5
                                C17.2 18.5 14.8 19.2 12 21
                                C9.2 19.2 6.8 18.5 4 18.5
                                Z
                            "
                        />

                        <path
                            d="M12 8V21"
                        />

                    </svg>

                </button>


                <!-- 설정 -->

                <button
                    id="settingsButton"
                    class="header-menu-btn"
                    type="button"
                    aria-label="설정"
                    title="설정"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <circle
                            cx="12"
                            cy="12"
                            r="3"
                        />

                        <path
                            d="
                                M19.4 15
                                A1.7 1.7 0 0 0 19.7 16.9
                                L19.8 17
                                A2 2 0 1 1 17 19.8
                                L16.9 19.7
                                A1.7 1.7 0 0 0 15 19.4
                                A1.7 1.7 0 0 0 14 21
                                V21.1
                                A2 2 0 1 1 10 21.1
                                V21
                                A1.7 1.7 0 0 0 9 19.4
                                A1.7 1.7 0 0 0 7.1 19.7
                                L7 19.8
                                A2 2 0 1 1 4.2 17
                                L4.3 16.9
                                A1.7 1.7 0 0 0 4.6 15
                                A1.7 1.7 0 0 0 3 14
                                H2.9
                                A2 2 0 1 1 2.9 10
                                H3
                                A1.7 1.7 0 0 0 4.6 9
                                A1.7 1.7 0 0 0 4.3 7.1
                                L4.2 7
                                A2 2 0 1 1 7 4.2
                                L7.1 4.3
                                A1.7 1.7 0 0 0 9 4.6
                                A1.7 1.7 0 0 0 10 3
                                V2.9
                                A2 2 0 1 1 14 2.9
                                V3
                                A1.7 1.7 0 0 0 15 4.6
                                A1.7 1.7 0 0 0 16.9 4.3
                                L17 4.2
                                A2 2 0 1 1 19.8 7
                                L19.7 7.1
                                A1.7 1.7 0 0 0 19.4 9
                                A1.7 1.7 0 0 0 21 10
                                H21.1
                                A2 2 0 1 1 21.1 14
                                H21
                                A1.7 1.7 0 0 0 19.4 15Z
                            "
                        />

                    </svg>

                </button>

            </nav>

        </header>


        <!-- =========================
             카테고리 선택
        ========================== -->

        <section class="filter-area">

            <button
                class="filter-btn active"
                data-category="전체"
            >
                전체
            </button>

            <button
                class="filter-btn"
                data-category="일반"
            >
                일반
            </button>

            <button
                class="filter-btn"
                data-category="신앙"
            >
                신앙
            </button>

        </section>


        <!-- =========================
             카드 영역
        ========================== -->

        <section class="card-area">

            <button
                id="cardButton"
                class="game-card"
                type="button"
            >


                <!-- =========================
                     카드 뒷면
                ========================== -->

                <div
                    id="cardBack"
                    class="card-back"
                >

                    <p id="deckLabel">
                        전체 카드덱
                    </p>

                    <h2>
                        PICK:ONE
                    </h2>

                    <span>
                        카드를 터치하세요
                    </span>

                </div>


                <!-- =========================
                     카드 앞면
                ========================== -->

                <div
                    id="cardFront"
                    class="card-front hidden"
                >

                    <div class="card-info">

                        <div class="card-category-group">

                            <span id="category">
                            </span>

                            <span id="cardNumber">
                            </span>

                        </div>


                        <span id="difficulty">
                        </span>

                    </div>


                    <!-- 질문 -->

                    <p class="question">

                        <span id="question">
                        </span>

                    </p>


                    <!-- 첫 번째 선택지 -->

                    <div class="option">

                        <p id="optionA">
                        </p>

                    </div>


                    <strong class="vs">
                        VS
                    </strong>


                    <!-- 두 번째 선택지 -->

                    <div class="option">

                        <p id="optionB">
                        </p>

                    </div>

                </div>

            </button>

        </section>


        <!-- =========================
             다음 카드
        ========================== -->

        <button
            id="nextButton"
            class="next-btn hidden"
            type="button"
        >
            다음 카드
        </button>

    </main>


    <!-- =========================
         설정 모달
    ========================== -->

    <div
        id="settingsModal"
        class="modal-overlay hidden"
        role="dialog"
        aria-modal="true"
        aria-labelledby="settingsTitle"
    >

        <div class="settings-panel">


            <!-- =========================
                 설정 헤더
            ========================== -->

            <div class="settings-header">

                <div>

                    <div class="settings-brand">

                        <strong class="settings-brand-title">
                            PICK:ONE
                        </strong>

                        <span class="settings-brand-subtitle">
                            BALANCE CARD GAME
                        </span>

                    </div>


                    <h2 id="settingsTitle">
                        설정
                    </h2>

                </div>


                <button
                    id="settingsCloseButton"
                    class="modal-close-btn"
                    type="button"
                    aria-label="설정 닫기"
                >
                    ×
                </button>

            </div>


            <!-- =========================
                 배경음악
            ========================== -->

            <div class="setting-item">

                <div class="setting-row">

                    <div class="setting-text">

                        <strong>
                            배경음악
                        </strong>

                        <span>
                            게임 배경음악을 조절합니다
                        </span>

                    </div>


                    <button
                        id="bgmToggle"
                        class="setting-toggle active"
                        type="button"
                        aria-pressed="true"
                    >
                        ON
                    </button>

                </div>


                <input
                    id="bgmVolume"
                    class="volume-slider"
                    type="range"
                    min="0"
                    max="100"
                    value="35"
                    aria-label="배경음악 볼륨"
                >

            </div>


            <!-- =========================
                 효과음
            ========================== -->

            <div class="setting-item">

                <div class="setting-row">

                    <div class="setting-text">

                        <strong>
                            효과음
                        </strong>

                        <span>
                            카드 효과음을 조절합니다
                        </span>

                    </div>


                    <button
                        id="sfxToggle"
                        class="setting-toggle active"
                        type="button"
                        aria-pressed="true"
                    >
                        ON
                    </button>

                </div>


                <input
                    id="sfxVolume"
                    class="volume-slider"
                    type="range"
                    min="0"
                    max="100"
                    value="100"
                    aria-label="효과음 볼륨"
                >

            </div>


            <!-- =========================
                 언어
            ========================== -->

            <div class="setting-item language-setting">

                <div class="language-setting-row">


                    <!-- 언어 제목 -->

                    <div class="language-title">

                        <strong>
                            언어
                        </strong>

                        <span class="development-badge">
                            개발중
                        </span>

                    </div>


                    <!-- 언어 드롭다운 -->

                    <div class="language-select-wrapper">

                        <select
                            id="languageSelect"
                            class="language-select"
                            aria-label="언어 선택"
                            disabled
                        >

                            <option value="ko">
                                한국어
                            </option>

                        </select>


                        <svg
                            class="language-select-icon"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path
                                d="M7 10L12 15L17 10"
                            />

                        </svg>

                    </div>

                </div>

            </div>
            <!-- =========================
                 설정 확인
            ========================== -->

            <button
                id="settingsConfirmButton"
                class="settings-confirm-btn"
                type="button"
            >
                확인
            </button>


        </div>

    </div>


    <!-- =========================
         오디오
    ========================== -->

    <!-- 배경음악 -->

    <audio
        id="bgm"
        src="assets/sounds/bgm.mp3"
        preload="auto"
        loop
    ></audio>


    <!-- 셔플 효과음 -->

    <audio
        id="shuffleSound"
        src="assets/sounds/shuffle.mp3"
        preload="auto"
    ></audio>


<!-- 질문 공개 효과음 -->

<audio
    id="revealSound"
    src="assets/sounds/reveal.mp3"
    preload="auto"
></audio>


<!-- 효과음 볼륨 확인음 -->

<audio
    id="checkSound"
    src="assets/sounds/check.mp3"
    preload="auto"
></audio>

<!-- =========================
     뒤로가기 토스트
========================== -->

<div
    id="backToast"
    class="back-toast"
    role="status"
    aria-live="polite"
>
    뒤로가기를 한 번 더 누르면 종료됩니다
</div>

    <!-- =========================
         JavaScript

         순서 중요:
         cards.js → script.js
    ========================== -->

    <script src="cards.js"></script>

    <script src="script.js"></script>


</body>

</html>
